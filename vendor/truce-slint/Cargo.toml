[package]
edition = "2024"
rust-version = "1.92"
name = "truce-slint"
version = "6.3.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Slint-based GUI backend for truce audio plugins"
homepage = "https://github.com/truce-audio/truce"
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/truce-audio/truce"

[lib]
name = "truce_slint"
path = "src/lib.rs"

[[test]]
name = "hidpi_scale_reconcile"
path = "tests/hidpi_scale_reconcile.rs"

[dependencies.bytemuck]
version = "1"
features = ["derive"]

[dependencies.log]
version = "0.4"

[dependencies.paste]
version = "1"

[dependencies.raw-window-handle]
version = "0.5"

[dependencies.slint]
version = "=1.15.1"
features = [
    "compat-1-2",
    "renderer-software",
    "std",
]
default-features = false

[dependencies.truce-core]
version = "6.3.0"

[dependencies.truce-gpu]
version = "6.3.0"

[dependencies.truce-gui]
version = "6.3.0"
default-features = false

[dependencies.truce-params]
version = "6.3.0"

[target.'cfg(not(target_os = "ios"))'.dependencies.baseview]
version = "0.1.1-truce.13"
package = "baseview-truce"

[target.'cfg(not(target_os = "ios"))'.dependencies.keyboard-types]
version = "0.7"

[target.'cfg(not(target_os = "ios"))'.dependencies.pollster]
version = "0.4"

[target.'cfg(not(target_os = "ios"))'.dependencies.wgpu]
version = "29"
features = ["wgsl"]
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "ios")'.dependencies.objc2-foundation]
version = "0.3"
features = [
    "NSString",
    "NSGeometry",
]

[target.'cfg(target_os = "macos")'.dependencies.objc]
version = "0.2"

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(feature, values("cargo-clippy"))']

[profile.shell]
inherits = "release"
